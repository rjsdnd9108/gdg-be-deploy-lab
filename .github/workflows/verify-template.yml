# 진행자용: 템플릿이 실습대로 동작하는지 자동으로 확인한다.
# - 템플릿 저장소(진행자 저장소)에서만 돈다. 멤버가 만든 저장소에서는 건너뛴다(skipped).
# - 수동 실행: Actions 탭 → verify-template → Run workflow
name: verify-template

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.is_template == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: "[STEP 1] Java 17에서 팀원 jar가 버전 에러로 실패하는가"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          set +e
          java -jar step1/study-api-teammate.jar > step1.log 2>&1
          code=$?
          set -e
          cat step1.log
          test "$code" -ne 0
          grep -q "UnsupportedClassVersionError" step1.log
          grep -q "class file version 65" step1.log

      - name: "[STEP 3] 정답 Dockerfile로 빌드되는가"
        run: docker build -f .devcontainer/Dockerfile.answer -t study-api:ci .

      - name: "[STEP 3] 로컬처럼 8080으로 뜨고 /studies가 응답하는가"
        run: |
          docker run -d --name local -p 8080:8080 study-api:ci
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && break; sleep 2; done
          echo
          curl -fs localhost:8080/studies | tee body.json
          echo
          grep -q '"content"' body.json
          grep -q '"studyId":1' body.json
          curl -fs "localhost:8080/studies?status=CLOSED" | tee closed.json
          echo
          if grep -q RECRUITING closed.json; then echo "status 필터가 안 먹음"; exit 1; fi
          docker logs local 2>&1 | grep "Started"
          docker logs local 2>&1 | grep -q "\[DATA\]"
          docker logs local 2>&1 | grep -q "\[REQ\] GET /studies"
          docker rm -f local

      - name: "[STEP 5] Render처럼 PORT=10000을 주면 10000으로 뜨는가"
        run: |
          docker run -d --name render -e PORT=10000 -p 10000:10000 study-api:ci
          for i in $(seq 1 60); do curl -fs localhost:10000/actuator/health && break; sleep 2; done
          echo
          curl -fs localhost:10000/actuator/health | grep -q UP
          docker rm -f render

      - name: "[STEP 4] studies.json만 바꾸면 의존성 단계가 CACHED인가"
        run: |
          python3 - <<'EOF'
          import json
          p = "src/main/resources/data/studies.json"
          data = json.load(open(p, encoding="utf-8"))
          data.append({"studyId": 99, "title": "CI 확인용 스터디", "content": "캐시 확인", "capacity": 2, "status": "RECRUITING"})
          json.dump(data, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF
          docker build --progress=plain -f .devcontainer/Dockerfile.answer -t study-api:ci2 . 2>&1 | tee build2.log
          grep -A1 "RUN ./gradlew dependencies" build2.log | grep -q CACHED
          git checkout -- src/main/resources/data/studies.json

      - name: "[보너스] 깨진 JSON이면 서버가 뜨지 않는가 (fail-fast)"
        run: |
          cp drills/studies-broken.json src/main/resources/data/studies.json
          docker build -f .devcontainer/Dockerfile.answer -t study-api:broken .
          set +e
          timeout 180 docker run --name broken study-api:broken > broken.log 2>&1
          code=$?
          set -e
          tail -40 broken.log
          test "$code" -ne 0
          test "$code" -ne 124
          grep -q "studies.json" broken.log
          git checkout -- src/main/resources/data/studies.json

      - name: "[숙제 D 준비] 빈 JSON이면 뜨긴 뜨고 목록이 비는가"
        run: |
          cp drills/studies-empty.json src/main/resources/data/studies.json
          docker build -f .devcontainer/Dockerfile.answer -t study-api:empty .
          docker run -d --name empty -p 8081:8080 study-api:empty
          for i in $(seq 1 60); do curl -fs localhost:8081/actuator/health && break; sleep 2; done
          echo
          curl -fs localhost:8081/studies | tee empty.json
          echo
          grep -q '"content":\[\]' empty.json
          docker rm -f empty
          git checkout -- src/main/resources/data/studies.json

      - name: 이미지 크기 기록
        if: always()
        run: docker images | grep -E "study-api|REPOSITORY" || true
